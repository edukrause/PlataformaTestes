server:
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: plataforma-testes
  datasource:
    url: ${PLATAFORMA_DB_URL:jdbc:h2:file:./data/plataforma}
    username: sa
    password: ${PLATAFORMA_DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
plataforma:
  confluence:
    base-url: ${CONFLUENCE_BASE_URL:}
    email: ${CONFLUENCE_EMAIL:}
    token: ${CONFLUENCE_API_TOKEN:}
    paginas: ${CONFLUENCE_PAGINAS:}
    api-version: ${CONFLUENCE_API_VERSION:2}
    auth-mode: ${CONFLUENCE_AUTH_MODE:basic}
  dominio:
    regras: ${DOMINIO_REGRAS:}
  catalogo:
    enviar-amostras: ${ERP_AMOSTRA_ENVIAR_MODELOS:false}
    cache-segundos: ${ERP_CATALOGO_CACHE_SEGUNDOS:60}
    schemas: ${ERP_CATALOGO_SCHEMAS:public}
    colunas-permitidas: ${ERP_AMOSTRA_COLUNAS:}
    max-amostras: ${ERP_AMOSTRA_MAX_VALORES:5}
    max-tabelas: ${ERP_CATALOGO_MAX_TABELAS:12}
    profundidade: ${ERP_CATALOGO_PROFUNDIDADE:1}
  erp:
    # SGBD do banco consultado: POSTGRESQL ou MYSQL. Define o gateway de leitura, o catálogo e o SQL pedido aos modelos.
    dialeto: ${ERP_DIALETO:POSTGRESQL}
  mysql:
    habilitado: ${ERP_MYSQL_HABILITADO:false}
    url: ${ERP_MYSQL_URL:}
    usuario: ${ERP_MYSQL_USUARIO:}
    senha: ${ERP_MYSQL_SENHA:}
    timeout-segundos: ${ERP_MYSQL_TIMEOUT_SEGUNDOS:10}
    max-linhas: ${ERP_MYSQL_MAX_LINHAS:1000}
    max-caracteres: ${ERP_MYSQL_MAX_CARACTERES:1000000}
  postgres:
    habilitado: ${ERP_POSTGRES_HABILITADO:false}
    url: ${ERP_POSTGRES_URL:}
    usuario: ${ERP_POSTGRES_USUARIO:}
    senha: ${ERP_POSTGRES_SENHA:}
    timeout-segundos: ${ERP_POSTGRES_TIMEOUT_SEGUNDOS:10}
    max-linhas: ${ERP_POSTGRES_MAX_LINHAS:1000}
    max-caracteres: ${ERP_POSTGRES_MAX_CARACTERES:1000000}
  ia:
    provedor: ${PLATAFORMA_IA_PROVEDOR:GEMINI}
    # desativada: só entrada manual; externa: gera com o provedor indicado acima (CLAUDE, GEMINI ou LLAMA).
    modo: ${PLATAFORMA_IA_MODO:desativada}
  modelos:
    max-tokens: ${MODELOS_MAX_TOKENS:4096}
    provedores:
      CLAUDE:
        habilitado: ${CLAUDE_HABILITADO:false}
        chave: ${ANTHROPIC_API_KEY:}
        modelo: ${ANTHROPIC_MODEL:}
        preco-entrada: ${ANTHROPIC_INPUT_PRICE:}
        preco-saida: ${ANTHROPIC_OUTPUT_PRICE:}
      GEMINI:
        habilitado: ${GEMINI_HABILITADO:false}
        chave: ${GEMINI_API_KEY:}
        modelo: ${GEMINI_MODEL:}
        preco-entrada: ${GEMINI_INPUT_PRICE:}
        preco-saida: ${GEMINI_OUTPUT_PRICE:}
      LLAMA:
        habilitado: ${GROQ_HABILITADO:false}
        chave: ${GROQ_API_KEY:}
        modelo: ${GROQ_MODEL:}
        preco-entrada: ${GROQ_INPUT_PRICE:}
        preco-saida: ${GROQ_OUTPUT_PRICE:}
  jira:
    status-mapa: ${JIRA_STATUS_MAPA:}
    escrita-habilitada: ${JIRA_ESCRITA_HABILITADA:false}
    transicoes: ${JIRA_TRANSICOES:}
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    token: ${JIRA_API_TOKEN:}
    api-version: ${JIRA_API_VERSION:3}
    auth-mode: ${JIRA_AUTH_MODE:basic}
    # Campo customizado opcional que identifica a área. Sem ele, o classificador usa o requisito.
    area-field: ${JIRA_AREA_FIELD:}
  privacy:
    # Nomes conhecidos separados por ;. O filtro por padrões não identifica nomes arbitrários.
    sensitive-terms: ${SENSITIVE_TERMS:}
