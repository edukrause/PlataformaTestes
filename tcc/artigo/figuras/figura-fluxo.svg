"middle">valor apurado?</text><path d="M165,110 L165,150" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><path d="M165,230 L165,270" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><path d="M165,340 L165,380" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><rect x="365" y="60" width="270" height="60" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="500.0" y="85.95" text-anchor="middle">Seleciona o subesquema</text><text x="500.0" y="105.95" text-anchor="middle">e as amostras permitidas</text><rect x="365" y="150" width="270" height="60" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="500.0" y="175.95" text-anchor="middle">Cada família habilitada</text><text x="500.0" y="195.95" text-anchor="middle">gera um SELECT</text><rect x="365" y="240" width="270" height="85" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="500.0" y="268.45" text-anchor="middle">Verifica: AST, EXPLAIN e</text><text x="500.0" y="288.45" text-anchor="middle">execução só leitura; nova</text><text x="500.0" y="308.45" text-anchor="middle">tentativa se inválido ou vazio</text><rect x="365" y="355" width="270" height="45" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="500.0" y="383.45" text-anchor="middle">Normaliza os resultados</text><polygon points="365.0,470 383.0,430.0 617.0,430.0 635.0,470 617.0,510.0 383.0,510.0" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="500" y="465.95" text-anchor="middle" font-weight="bold">Dois ou mais</text><text x="500" y="485.95" text-anchor="middle">coincidem?</text><rect x="360" y="560" width="135" height="95" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="427.5" y="593.45" text-anchor="middle">Unânime ou</text><text x="427.5" y="613.45" text-anchor="middle">maioria:</text><text x="427.5" y="633.45" text-anchor="middle">referência</text><rect x="505" y="560" width="135" height="95" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="572.5" y="593.45" text-anchor="middle">Divergente</text><text x="572.5" y="613.45" text-anchor="middle">ou falha: sem</text><text x="572.5" y="633.45" text-anchor="middle">referência</text><path d="M500,120 L500,150" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><path d="M500,210 L500,240" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><path d="M500,325 L500,355" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><path d="M500,400 L500,430" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><path d="M445,510 L427,560" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><text x="425" y="540" text-anchor="end" font-size="16" paint-order="stroke" stroke="#fff" stroke-width="5">sim</text><path d="M555,510 L573,560" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#m)"/><text x="575" y="540" text-anchor="start" font-size="16" paint-order="stroke" stroke="#fff" stroke-width="5">não</text><rect x="700" y="60" width="270" height="85" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="835.0" y="88.45" text-anchor="middle">Compõe a saída:</text><text x="835.0" y="108.45" text-anchor="middle">cenários, valores</text><text x="835.0" y="128.45" text-anchor="middle">e consultas anexadas</text><rect x="700" y="300" width="270" height="90" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/><text x="835.0" y="330.95" text-anchor="middle">Analista aceita, ajusta</text><text x="835.0" y="350.95" text-anchor="middle">ou rejeita; corrige</text><text x="835.0" y="370.95" text-anchor="middle">valores, se preciso</text><rect x="700" y="450" width="270" height="70" rx="24" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="835.0" y="480.95" text-anchor="middle">Decisão, tempos e</text><text x="835.0" y="500.95" text-anchor="middle">custos registrados</text><path d="M835,145 L835,300" fill="none" stroke="#333" stroke-width="1.6" marker-end=