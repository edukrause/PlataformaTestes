name: Verifica backend e frontend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/**', '.github/workflows/verifica.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/**', '.github/workflows/verifica.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste-local
          POSTGRES_DB: plataforma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: teste-local
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pteste-local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATAFORMA_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/plataforma_test
      PLATAFORMA_TEST_PG_ADMIN: postgres
      PLATAFORMA_TEST_PG_SENHA: teste-local
      PLATAFORMA_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/
      PLATAFORMA_TEST_MYSQL_ADMIN: root
      PLATAFORMA_TEST_MYSQL_SENHA: teste-local
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API: http
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: matrix.postgres == '16'
        with:
          name: plataforma-testes-executavel
          path: backend/target/plataforma-testes-0.1.0-SNAPSHOT.jar
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
